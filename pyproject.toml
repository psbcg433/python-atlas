[project]
name = "python-course"
version = "0.1.0"
description = "Notebook-based Python engineering course: language core, CPython internals, tooling, concurrency and FastAPI."
requires-python = ">=3.15"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.20.1",
    "anyio>=4.15.1",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "attrs>=26.1.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.126",
    "cachetools>=8.0.0",
    "fastapi[standard]>=0.163.1",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.6",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "more-itertools>=11.2.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "polars>=2.1.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.28.0",
    "uvloop>=0.23.0 ; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "hypothesis>=6.170.15",
    "line-profiler>=5.1.0",
    "locust>=2.47.0",
    "memray>=1.20.0 ; sys_platform != 'win32'",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "py-spy>=0.4.3",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "scalene>=2.4.0",
    "schemathesis>=4.33.4",
    "snakeviz>=2.2.2",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-include = ["*.ipynb"]
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Unit, project and build modules hold notebook markdown (long table rows) inside strings.
"scripts/phase*/unit_*.py" = ["E501"]
"scripts/phase*/project.py" = ["E501"]
"scripts/phase*/build.py" = ["E501"]
# Notebooks keep sys.version_info guards (course convention 5) and each unit re-imports
# what it needs so it can run on its own (convention 12).
"notebooks/*.ipynb" = ["UP036", "F811"]
# Phase 6 units import their shared helpers with `from phase6_helpers import *` (the module's
# __all__ lists exactly what comes in), so names used after it come from a star import.
"notebooks/phase6_web_fastapi.ipynb" = ["F403", "F405"]
