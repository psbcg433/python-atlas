# CI and release for the log-analyzer package in projects/log-analyzer/.
#
# - test:    ruff, mypy --strict and pytest (coverage must stay >= 90%) on Python 3.12-3.15,
#            for pushes and pull requests that touch the package (and for releases).
# - build:   sdist + wheel, smoke-tested, uploaded as an artifact. On a release tag it also
#            checks that the tag matches the version in pyproject.toml.
# - publish: uploads the artifact to TestPyPI with trusted publishing (OpenID Connect):
#            no API token is stored anywhere. Runs only for tags log-analyzer-v* and for a
#            manual "Run workflow", and only after test and build pass.
name: log-analyzer

on:
  push:
    branches: ["**"]
    tags: ["log-analyzer-v*"] # path filters are not applied to tag pushes
    paths:
      - "projects/log-analyzer/**"
      - ".github/workflows/log-analyzer.yml"
  pull_request:
    paths:
      - "projects/log-analyzer/**"
      - ".github/workflows/log-analyzer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: log-analyzer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: projects/log-analyzer

env:
  HYPOTHESIS_PROFILE: ci # derandomized property tests: a CI failure reproduces locally

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: projects/log-analyzer/uv.lock
      - name: Install the package and its dev tools from uv.lock
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run --locked ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: uv run --locked ruff format --check .
      - name: Type check (mypy --strict)
        run: uv run --locked mypy --strict
      - name: Test with coverage (fails under 90%)
        run: uv run --locked pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/log-analyzer-v')
        run: |
          package_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#log-analyzer-v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $package_version in pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl log-analyzer --version
      - uses: actions/upload-artifact@v7
        with:
          name: log-analyzer-dist
          path: projects/log-analyzer/dist/
          if-no-files-found: error

  publish:
    name: publish to TestPyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/log-analyzer-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/log-analyzer-psbcg433
    permissions:
      id-token: write # lets the job request the OIDC token that TestPyPI trusts
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: log-analyzer-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
