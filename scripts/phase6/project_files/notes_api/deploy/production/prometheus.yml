# Prometheus on the Notes API server. It finds every api replica through Docker's DNS (replicas
# come and go during a rollout), scrapes /metrics inside the network every 15 s, keeps 15 days,
# and evaluates the alert rules. Open it through an SSH tunnel: http://127.0.0.1:9090
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: notes-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"] # one A record per running api container
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
