[project]
name = "python-course"
version = "0.1.0"
description = "Notebook-based Python engineering course: language core, CPython internals, tooling, concurrency and FastAPI."
requires-python = ">=3.15"
dependencies = [
    "attrs>=26.1.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.126",
    "cachetools>=8.0.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.6",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "more-itertools>=11.2.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.28.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-include = ["*.ipynb"]
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Unit, project and build modules hold notebook markdown (long table rows) inside strings.
"scripts/phase*/unit_*.py" = ["E501"]
"scripts/phase*/project.py" = ["E501"]
"scripts/phase*/build.py" = ["E501"]
# Notebooks keep sys.version_info guards (course convention 5) and each unit re-imports
# what it needs so it can run on its own (convention 12).
"notebooks/*.ipynb" = ["UP036", "F811"]
