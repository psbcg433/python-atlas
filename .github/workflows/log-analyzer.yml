# CI and release for the log-analyzer package in projects/log-analyzer/.
#
# - test:    ruff, mypy --strict and pytest (coverage must stay >= 90%) on Python 3.12-3.15
#            (Linux), plus Windows and macOS on 3.15, for pushes, pull requests and manual runs
#            that touch the package (and for release tags).
# - build:   sdist + wheel, smoke-tested, the test suite run again from the unpacked sdist,
#            uploaded as an artifact. On a release tag it also checks that the tag matches
#            the version in pyproject.toml.
# - publish: uploads the artifact to TestPyPI with trusted publishing (OpenID Connect): no
#            API token is stored anywhere. Runs only for tags log-analyzer-v*, and only after
#            test and build pass. A manual "Run workflow" runs test and build, never publish.
#
# Every action is pinned to a full commit SHA (a moved tag cannot change what runs); the
# comment names the release that SHA belongs to.
name: log-analyzer

on:
  push:
    branches: ["**"]
    tags: ["log-analyzer-v*"] # path filters are not applied to tag pushes
    paths:
      - "projects/log-analyzer/**"
      - ".github/workflows/log-analyzer.yml"
  pull_request:
    paths:
      - "projects/log-analyzer/**"
      - ".github/workflows/log-analyzer.yml"
  workflow_dispatch: # manual runs: test and build only

permissions:
  contents: read

concurrency:
  group: log-analyzer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: projects/log-analyzer

env:
  HYPOTHESIS_PROFILE: ci # derandomized property tests: a CI failure reproduces locally

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: projects/log-analyzer/uv.lock
      - name: Install the package and its dev tools from uv.lock
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run --locked ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: uv run --locked ruff format --check .
      - name: Type check (mypy --strict)
        run: uv run --locked mypy --strict
      - name: Test with coverage (fails under 90%)
        run: uv run --locked pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/log-analyzer-v')
        run: |
          package_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#log-analyzer-v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $package_version in pyproject.toml"
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl log-analyzer --version
      - name: Run the test suite from the unpacked sdist
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/log_analyzer_psbcg433-*/
          uv run --isolated --group dev pytest -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-analyzer-dist
          path: projects/log-analyzer/dist/
          if-no-files-found: error

  publish:
    name: publish to TestPyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/log-analyzer-v')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/log-analyzer-psbcg433
    permissions:
      id-token: write # lets the job request the OIDC token that TestPyPI trusts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: log-analyzer-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
